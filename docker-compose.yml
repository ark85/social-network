x-postgres-common: &postgres-common
  build: ./compose-configuration/postgres
  cpus: "1.0"
  mem_limit: 1g
  networks:
    - postgres
  depends_on:
    etcd:
      condition: service_healthy

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${SOCIAL_NETWORK_DB_NAME}
  POSTGRES_USER: ${SOCIAL_NETWORK_DB_USERNAME}
  POSTGRES_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
  POSTGRES_REPLICATION_USER: ${REPLICATION_USER}
  POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
  ETCD_NAME: etcd

x-citus-environment: &citus-environment
  <<: *postgres-environment
  PGPASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}

x-citus-postgres: &citus-postgres
  image: citusdata/citus:14.2.0
  environment:
    <<: *citus-environment
  command:
    - postgres
    - -c
    - wal_level=logical

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.26
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: default=http://etcd:2380

    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health", "--endpoints=http://etcd:2379" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - postgres

  postgres-1:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      PATRONI_NAME: postgres-1
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://postgres-1:8008/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 5432

  postgres-2:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      PATRONI_NAME: postgres-2
    volumes:
      - postgres_2_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://postgres-2:8008/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 5432

  postgres-3:
    <<: *postgres-common
    environment:
      <<: *postgres-environment
      PATRONI_NAME: postgres-3
    volumes:
      - postgres_3_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://postgres-3:8008/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 5432

  haproxy:
    build: ./compose-configuration/haproxy

    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy

    networks:
      - postgres
      - social_network

    volumes:
      - ./compose-configuration/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    healthcheck:
      test: [ "CMD-SHELL", "nc -z haproxy 5432 && nc -z haproxy 5433" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"
      - "5433:5433"
      - "8404:8404"

    expose:
      - 5432
      - 5433
      - 8404

  citus-coordinator:
    profiles: ["dialog-migration"]
    <<: *citus-postgres
    ports:
      - "55432:5432"
    volumes:
      - citus_coordinator_data:/var/lib/postgresql
    networks:
      - social_network
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-worker-1:
    profiles: ["dialog-migration"]
    <<: *citus-postgres
    volumes:
      - citus_worker_1_data:/var/lib/postgresql
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-worker-2:
    profiles: ["dialog-migration"]
    <<: *citus-postgres
    volumes:
      - citus_worker_2_data:/var/lib/postgresql
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  tarantool:
    build: ./compose-configuration/tarantool
    entrypoint: ["sh", "/opt/tarantool/entrypoint.sh"]
    command: ["/opt/tarantool/init.lua"]
    environment:
      TARANTOOL_USERNAME: ${TARANTOOL_USERNAME}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD}
      SOCIAL_NETWORK_DB_NAME: ${SOCIAL_NETWORK_DB_NAME}
      SOCIAL_NETWORK_DB_USERNAME: ${SOCIAL_NETWORK_DB_USERNAME}
      SOCIAL_NETWORK_DB_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
    volumes:
      - ./compose-configuration/tarantool/entrypoint.sh:/opt/tarantool/entrypoint.sh:ro
      - ./compose-configuration/tarantool/init.lua:/opt/tarantool/init.lua:ro
      - ./compose-configuration/tarantool/schema.lua:/opt/tarantool/schema.lua:ro
      - ./compose-configuration/tarantool/import_dialogs.lua:/opt/tarantool/import_dialogs.lua:ro
      - tarantool_data:/var/lib/tarantool
    networks:
      - social_network
    ports:
      - "3301:3301"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3301'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    networks:
      - social_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --raw incr ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbit:
    build: ./compose-configuration/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    networks:
      - social_network
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_listener 61613" ]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    expose:
      - 8080

    environment:
      SOCIAL_NETWORK_READ_DB_URL: ${SOCIAL_NETWORK_READ_DB_URL}
      SOCIAL_NETWORK_WRITE_DB_URL: ${SOCIAL_NETWORK_WRITE_DB_URL}
      TARANTOOL_HOST: tarantool
      TARANTOOL_PORT: 3301
      TARANTOOL_USERNAME: ${TARANTOOL_USERNAME}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD}
      SOCIAL_NETWORK_DB_USERNAME: ${SOCIAL_NETWORK_DB_USERNAME}
      SOCIAL_NETWORK_DB_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RABBIT_HOST: rabbit
      RABBIT_PORT: 5672
      RABBIT_USERNAME: ${RABBIT_USERNAME}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      RABBIT_STOMP_PORT: 61613

    depends_on:
      haproxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      tarantool:
        condition: service_healthy

    networks:
      - social_network

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://backend:8080/api/health-check/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------- monitoring start -------------

  postgres-exporter-1:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres-1:5432/${SOCIAL_NETWORK_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      DATA_SOURCE_PASS: ${SOCIAL_NETWORK_DB_PASSWORD}
    expose:
      - 9187
    networks:
      - postgres
    depends_on:
      postgres-1:
        condition: service_healthy

  postgres-exporter-2:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres-2:5432/${SOCIAL_NETWORK_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      DATA_SOURCE_PASS: ${SOCIAL_NETWORK_DB_PASSWORD}
    expose:
      - 9187
    networks:
      - postgres
    depends_on:
      postgres-2:
        condition: service_healthy

  postgres-exporter-3:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres-3:5432/${SOCIAL_NETWORK_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      DATA_SOURCE_PASS: ${SOCIAL_NETWORK_DB_PASSWORD}
    expose:
      - 9187
    networks:
      - postgres
    depends_on:
      postgres-3:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./compose-configuration/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    depends_on:
      - cadvisor
      - node-exporter
      - postgres-exporter-1
      - postgres-exporter-2
      - postgres-exporter-3
    networks:
      - postgres
      - social_network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - postgres

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    restart: unless-stopped
    privileged: true
    command:
      - -docker_only=true
      - -housekeeping_interval=1s
      - -port=8080
      - -disable_metrics=disk
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 8080
    networks:
      - postgres

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./compose-configuration/monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    networks:
      - postgres
    ports:
      - 3000:3000

  # ----------- monitoring end -------------

volumes:
  postgres_data:
  postgres_2_data:
  postgres_3_data:
  prometheus_data:
  grafana_data:
  tarantool_data:
  citus_coordinator_data:
  citus_worker_1_data:
  citus_worker_2_data:

networks:
  postgres:
  social_network:
