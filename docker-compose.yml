services:
  postgres-master:
    build: ./compose-configuration/postgres/master
    container_name: social-network-postgres-master

    environment:
      POSTGRES_DB: ${SOCIAL_NETWORK_DB_NAME}
      POSTGRES_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      POSTGRES_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
      POSTGRES_HOST: postgres-master
      POSTGRES_REPLICATION_USER: ${REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}

    networks:
      - postgres

    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_basebackup:/var/lib/postgresql/basebackup

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - 5432

  postgres-replica-1:
    build: ./compose-configuration/postgres/replica
    container_name: social-network-postgres-replica-1

    environment:
      POSTGRES_DB: ${SOCIAL_NETWORK_DB_NAME}
      POSTGRES_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      POSTGRES_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
      POSTGRES_REPLICATION_USER: ${REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      REPLICA_NAME: postgres-replica-1

    depends_on:
      postgres-master:
        condition: service_healthy

    networks:
      - postgres

    volumes:
      - postgres_replica_1_data:/var/lib/postgresql
      - postgres_basebackup:/var/lib/postgresql/basebackup:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - 5432

  postgres-replica-2:
    build: ./compose-configuration/postgres/replica
    container_name: social-network-postgres-replica-2

    environment:
      POSTGRES_DB: ${SOCIAL_NETWORK_DB_NAME}
      POSTGRES_USER: ${SOCIAL_NETWORK_DB_USERNAME}
      POSTGRES_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
      POSTGRES_REPLICATION_USER: ${REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      REPLICA_NAME: postgres-replica-2

    depends_on:
      postgres-master:
        condition: service_healthy

    networks:
      - postgres

    volumes:
      - postgres_replica_2_data:/var/lib/postgresql
      - postgres_basebackup:/var/lib/postgresql/basebackup:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - 5432

  haproxy:
    build: ./compose-configuration/haproxy
    container_name: social-network-haproxy

    depends_on:
      postgres-master:
        condition: service_healthy

    networks:
      - postgres
      - social_network

    volumes:
      - ./compose-configuration/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    healthcheck:
      test: [ "CMD-SHELL", "nc -z haproxy 5432 && nc -z haproxy 5433" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"
      - "5433:5433"

    expose:
      - 5432
      - 5433

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: social-network-backend

    ports:
      - "8080:8080"

    expose:
      - 8080

    environment:
      SOCIAL_NETWORK_READ_DB_URL: ${SOCIAL_NETWORK_READ_DB_URL}
      SOCIAL_NETWORK_WRITE_DB_URL: ${SOCIAL_NETWORK_WRITE_DB_URL}
      SOCIAL_NETWORK_DB_USERNAME: ${SOCIAL_NETWORK_DB_USERNAME}
      SOCIAL_NETWORK_DB_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}

    depends_on:
      haproxy:
        condition: service_healthy

    networks:
      - social_network

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://backend:8080/api/health-check/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------- monitoring start -------------

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./compose-configuration/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    links:
      - cadvisor:cadvisor
      - alertmanager:alertmanager
      - node-exporter:node-exporter
    networks:
      - postgres
      - social_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    restart: unless-stopped
    expose:
      - 9100
    networks:
      - postgres
      - social_network

  alertmanager:
    image: prom/alertmanager
    container_name: monitoring_alertmanager
    ports:
      - 9093:9093
    expose:
      - 9093
    volumes:
      - ./compose-configuration/monitoring/alertmanager/:/etc/alertmanager/
    restart: always
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - postgres
      - social_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: monitoring_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - 9080
    networks:
      - postgres
      - social_network

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: unless-stopped
    links:
      - prometheus:prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./compose-configuration/monitoring/grafana/provisioning:/var/lib/grafana/provisioning
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    networks:
      - postgres
      - social_network
    ports:
      - 3000:3000

  # ----------- monitoring end -------------

volumes:
  postgres_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
  postgres_basebackup:
  prometheus_data:
  grafana_data:

networks:
  postgres:
  social_network:
