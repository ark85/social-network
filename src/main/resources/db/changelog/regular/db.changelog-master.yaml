databaseChangeLog:
  - changeSet:
      id: 1
      author: ark85
      comment: add pgcrypto extension
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;
  - changeSet:
      id: 2
      author: ark85
      comment: users table creation
      changes:
        - sqlFile:
            path: db/changelog/regular/v1/002_create_users_table.sql
  - changeSet:
      id: 3
      author: ark85
      comment: add index for search
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_users_name ON users (first_name text_pattern_ops, second_name text_pattern_ops);
  - changeSet:
      id: 4
      author: ark85
      comment: posts table creation
      changes:
        - sqlFile:
            path: db/changelog/regular/v1/004_create_posts_table.sql
  - changeSet:
      id: 5
      author: ark85
      comment: add index for posts feed ordering
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_posts_creation_date_time ON posts (creation_date_time DESC);
  - changeSet:
      id: 6
      author: ark85
      comment: friends table creation
      changes:
        - sqlFile:
            path: db/changelog/regular/v1/006_create_friends_table.sql
  - changeSet:
      id: 7
      author: ark85
      comment: add index for friends search by user_id
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_friends_user_id ON friends(user_id);
  - changeSet:
      id: 8
      author: ark85
      comment: add author_id to posts table
      changes:
        - sqlFile:
            path: db/changelog/regular/v1/008_add_author_id_to_posts_table.sql
  - changeSet:
      id: 9
      author: ark85
      comment: add index for posts search by author_id
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_posts_author_id ON posts(author_id);
