databaseChangeLog:
  - changeSet:
      id: 1
      author: ark85
      comment: add citus extension
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS citus;
  - changeSet:
      id: 2
      author: ark85
      comment: dialog_messages table creation
      changes:
        - sqlFile:
            path: db/changelog/citus/v1/create_dialog_messages_table.sql
  - changeSet:
      id: 3
      author: ark85
      comment: set distributed dialog_messages table
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT count(*) FROM pg_dist_partition WHERE logicalrelid = 'public.dialog_messages'::regclass
      changes:
        - sql:
            sql: SELECT create_distributed_table('dialog_messages', 'dialog_id');
  - changeSet:
      id: 4
      author: ark85
      comment: add index for dialogs search
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_dialog_messages_dialog_creation_date_time ON dialog_messages (dialog_id, creation_date_time DESC);
