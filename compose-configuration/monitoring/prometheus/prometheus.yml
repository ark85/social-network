global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: social_network

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-master:9187"]
        labels:
          db_instance: postgres-master
          role: master
      - targets: ["postgres-exporter-replica-1:9187"]
        labels:
          db_instance: postgres-replica-1
          role: replica
      - targets: ["postgres-exporter-replica-2:9187"]
        labels:
          db_instance: postgres-replica-2
          role: replica
    relabel_configs:
      - source_labels: [db_instance]
        target_label: instance
