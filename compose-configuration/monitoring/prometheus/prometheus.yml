global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
  external_labels:
    monitor: social_network

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-1:9187"]
        labels:
          db_instance: postgres-1
      - targets: ["postgres-exporter-2:9187"]
        labels:
          db_instance: postgres-2
      - targets: ["postgres-exporter-3:9187"]
        labels:
          db_instance: postgres-3
    relabel_configs:
      - source_labels: [db_instance]
        target_label: instance

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy:8404"]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
