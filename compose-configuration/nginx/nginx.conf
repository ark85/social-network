worker_processes auto;
events {
    worker_connections 1024;
}
http {
    error_log /var/log/nginx/error.log warn;
    log_format upstream '$remote_addr "$request" $status '
                        'upstream=$upstream_addr status=$upstream_status';
    access_log /var/log/nginx/access.log upstream;

    upstream social_network_backend {
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
    }
    server {
        listen 80;
        location /ws/ {
            proxy_pass http://social_network_backend;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://social_network_backend;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header Connection close;
        }
    }
}
